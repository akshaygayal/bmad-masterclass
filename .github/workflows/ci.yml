name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: alignment-app

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alignment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: "true"
      # CI-only throwaway database; no production secrets are used here.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alignment_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/alignment_test
      SESSION_SECRET: ci-only-not-a-secret
      APP_ORIGIN: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: alignment-app/.nvmrc
          cache: npm
          cache-dependency-path: alignment-app/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Apply migrations
        run: npm run db:migrate
      - name: Check migrations for drift or conflicts
        run: npx drizzle-kit check
      - run: npm run test:integration
      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (smoke, headers, axe)
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: alignment-app/playwright-report
          retention-days: 7
